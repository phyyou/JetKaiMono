# Push a tag matching config.yaml's font.version (e.g. v0.1.0) to build and publish a release.
# Run it manually from the Actions tab to build without releasing; the zips are kept as artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check tag matches font version
        if: github.ref_type == 'tag'
        run: |
          version=$(uv run python -c "import yaml; print(yaml.safe_load(open('config.yaml'))['font']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match font.version $version in config.yaml"
            exit 1
          fi

      - name: Cache source fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources
          key: sources-${{ hashFiles('config.yaml') }}

      - name: Fetch sources
        run: uv run jetkai fetch

      - name: Build and verify
        run: uv run jetkai build -j 4

      - name: Package
        run: uv run jetkai package

      - name: Upload artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jetkai-mono
          path: output/dist/
          compression-level: 0
          retention-days: 7

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" output/dist/*
          --title "JetKai Mono $GITHUB_REF_NAME"
          --notes-file output/release-notes.md
          --generate-notes
          --verify-tag
