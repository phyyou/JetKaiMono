[project]
name = "jetkai-mono"
version = "0.1.0"
description = "JetBrains Mono Nerd Font + LXGW WenKai Mono KR: a 2:1 monospace font for Korean, Japanese and Chinese"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.60",
    "pyyaml>=6.0",
]

[project.scripts]
jetkai = "jetkai.cli:main"

[dependency-groups]
dev = [
    "pillow>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jetkai"]
